<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>PQC Web App</title>
  <!-- Bootstrap 5 CSS -->
  <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.2/dist/css/bootstrap.min.css" rel="stylesheet">
</head>
<body class="bg-light">

  <div class="container py-5">
    <h1 class="mb-5 text-center">🔒 Post-Quantum Cryptography Demo</h1>

    <!-- Key Generation Card -->
    <div class="card shadow mb-5">
      <div class="card-body">
        <h4 class="card-title mb-3">Key Generation</h4>
        <button id="btn-keygen" class="btn btn-primary mb-3">Generate Keys</button>
        <pre id="output-keygen" class="bg-white p-3 rounded" style="min-height: 150px;"></pre>
      </div>
      <div id="keysOutput" style="margin-top: 20px;"></div>

    </div>

    <!-- Encryption Card -->
    <div class="card shadow mb-5">
      <div class="card-body">
        <h4 class="card-title mb-3">Encrypt Message</h4>

        <div class="mb-3">
          <label for="enc-pk" class="form-label">Public Key (hex)</label>
          <textarea id="enc-pk" class="form-control" rows="3" placeholder="Paste the public key here"></textarea>
        </div>

        <div class="mb-3">
          <label for="enc-msg" class="form-label">Message</label>
          <input id="enc-msg" type="text" class="form-control" placeholder="Enter your message">
        </div>

        <button id="btn-encrypt" class="btn btn-success mb-3">Encrypt</button>
        <pre id="output-encrypt" class="bg-white p-3 rounded" style="min-height: 150px;"></pre>
      </div>
    </div>

    <!-- Decryption Card -->
    <div class="card shadow mb-5">
      <div class="card-body">
        <h4 class="card-title mb-3">Decrypt Ciphertext</h4>

        <div class="mb-3">
          <label for="dec-sk" class="form-label">Private Key (hex)</label>
          <textarea id="dec-sk" class="form-control" rows="3" placeholder="Paste the private key here"></textarea>
        </div>

        <div class="mb-3">
          <label for="dec-ct" class="form-label">Ciphertext (hex)</label>
          <textarea id="dec-ct" class="form-control" rows="3" placeholder="Paste the ciphertext here"></textarea>
        </div>

        <button id="btn-decrypt" class="btn btn-warning mb-3">Decrypt</button>
        <pre id="output-decrypt" class="bg-white p-3 rounded" style="min-height: 150px;"></pre>
      </div>
    </div>

  </div>

  <!-- Bootstrap 5 JS -->
  <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.2/dist/js/bootstrap.bundle.min.js"></script>

  <script>
    // Helper function to POST JSON
    async function postJson(url, data) {
      const response = await fetch(url, {
        method: 'POST',
        headers: { 'Content-Type': 'application/json' },
        body: JSON.stringify(data)
      });
      return await response.json();
    }

    document.getElementById('btn-keygen').onclick = async () => {
      const out = await postJson('/keygen', {});
      document.getElementById('output-keygen').textContent = JSON.stringify(out, null, 2);
      document.getElementById('enc-pk').value = out.public_key;
      document.getElementById('dec-sk').value = out.private_key;
    };

    document.getElementById('btn-encrypt').onclick = async () => {
      const pk = document.getElementById('enc-pk').value.trim();
      const msg = document.getElementById('enc-msg').value;
      const out = await postJson('/encrypt', { public_key: pk, message: msg });
      document.getElementById('output-encrypt').textContent = JSON.stringify(out, null, 2);
      document.getElementById('dec-ct').value = out.ciphertext || '';
    };

    document.getElementById('btn-decrypt').onclick = async () => {
      const sk = document.getElementById('dec-sk').value.trim();
      const ct = document.getElementById('dec-ct').value.trim();
      const out = await postJson('/decrypt', { private_key: sk, ciphertext: ct });
      document.getElementById('output-decrypt').textContent = JSON.stringify(out, null, 2);
    };

    document.getElementById('generateBtn').addEventListener('click', function() {
    const publicKey = "PUBLIC_KEY_EXAMPLE";
    const privateKey = "PRIVATE_KEY_EXAMPLE";
    document.getElementById('keysOutput').innerHTML = `
      <strong>Public Key:</strong><br><textarea style="width:100%; height:80px;">${publicKey}</textarea><br><br>
      <strong>Private Key:</strong><br><textarea style="width:100%; height:80px;">${privateKey}</textarea>
    `;
  });
  </script>

</body>
</html>
